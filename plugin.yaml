name: pass-secrets
version: 1.1.0
description: "pass (password-store) secret source — resolves secrets from a local GPG-encrypted store into environment variables at startup, and stores new secrets from chat with /s."
author: "D Yiapanis"
kind: standalone
# Secret-source plugin: fetch() is invoked by the orchestrator (never by the
# agent), so the agent-visible capability surface is empty by design.
provides_tools: []
provides_hooks:
- pre_gateway_dispatch
provides_middleware: []
requires_env: []
requires_hermes: ">=0.21.4"
pip_dependencies: []
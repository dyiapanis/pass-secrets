name: pass-secrets
version: 1.0.0
description: "pass (password-store) secret source — GPG-encrypted, git-tracked, local filesystem. Resolves secrets from ~/.password-store into environment variables at startup. No network dependency, no token expiry, works in all subprocess contexts."
author: "D Yiapanis"
kind: general
# Secret-source plugin: fetch() is invoked by the orchestrator (never by the
# agent), so the agent-visible capability surface is empty by design.
provides_tools: []
provides_hooks: []
provides_middleware: []
requires_env: []
requires_hermes: ">=0.21.4"
pip_dependencies: []